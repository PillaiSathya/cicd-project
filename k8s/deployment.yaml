apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-project
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cicd-project
  template:
    metadata:
      labels:
        app: cicd-project
    spec:
      containers:
      - name: cicd-project
        image: pillaisathya/cicd-project:33
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
